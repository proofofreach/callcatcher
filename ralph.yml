cli:
  backend: claude

prompt_file: .agent/prompt.md

limits:
  max_iterations: 40
  max_cost: 30.0

hats:
  planner:
    backend: claude
    triggers:
      - "PLAN_"
      - "DESIGN_"

  builder:
    backend: openrouter
    triggers:
      - "BUILD_"
      - "IMPLEMENT_"
      - "CODE_"

  reviewer:
    backend: claude
    triggers:
      - "REVIEW_"
      - "VERIFY_"

backpressure:
