# Generated by ralph-wizard
# Mode: Build | Stack: Next.js | Strategy: Efficient

cli:
  backend: claude

event_loop:
  prompt_file: .agent/prompt.md
  max_iterations: 40
  max_cost_usd: 30.0

hats:
  planner:
    name: "Planner"
    description: "Plans implementation approach and designs solutions"
    backend: claude
    triggers:
      - "PLAN_"
      - "DESIGN_"

  builder:
    name: "Builder"
    description: "Implements features and writes code"
    backend: openrouter
    triggers:
      - "BUILD_"
      - "IMPLEMENT_"
      - "CODE_"

  reviewer:
    name: "Reviewer"
    description: "Reviews code and verifies implementation quality"
    backend: claude
    triggers:
      - "REVIEW_"
      - "VERIFY_"

backpressure:
  - name: type-check
    command: npm run type-check
  - name: build
    command: npm run build
  - name: lint
    command: npm run lint
